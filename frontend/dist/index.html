<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜃楼 TV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">蜃楼 <span class="sub">TV</span></div>
  <span class="spacer"></span>
  <button class="btn sm" id="btnTheme" title="切换皮肤">皮肤</button>
  <button class="btn sm" id="btnShortcuts" title="键盘快捷键说明">快捷键</button>
  <div class="topinfo" id="dirLabel"></div>
  <div class="winctl" title="窗口控制">
    <button class="wc wc-min" id="wcMin" title="最小化"></button>
    <button class="wc wc-max" id="wcMax" title="最大化 / 还原"></button>
    <button class="wc wc-close" id="wcClose" title="关闭（最小化到托盘，观看不中断）"></button>
  </div>
</header>

<div class="shell">
<div class="sidecol">
<nav class="sidenav">
  <button class="navitem active" data-tab="playlists">频道列表</button>
  <button class="navitem" data-tab="search">电视台搜索</button>
  <button class="navitem" data-tab="recordings">录制回看</button>
</nav>
  <!-- 非频道列表页的左栏占位：正在观看迷你卡（点击回频道列表页） -->
  <aside class="nowcard hide" id="nowCard" title="回到频道列表页">
    <div class="nowcard-head">正在观看</div>
    <button class="nowcard-body" id="nowGo">
      <span class="dot" id="nowDot"></span>
      <span class="nowcard-meta">
        <span class="nowcard-name" id="nowName">未在观看</span>
        <span class="nowcard-sub" id="nowSub">去「频道列表」选一个频道吧</span>
      </span>
      <span class="nowcard-go" aria-hidden="true">›</span>
    </button>
  </aside>
  <aside class="chtree" id="chtreeCard">
    <div class="chtree-head">
      <span>频道列表</span>
      <span class="spacer"></span>
      <button class="iconbtn" id="btnNewPl" title="新建列表">＋</button>
    </div>
    <div class="chtree-body" id="chtreeBody"></div>
  </aside>
</div>

<main>
  <!-- 页签一：频道列表管理 -->
  <section id="tab-playlists" class="tabpane active">
    <div class="watchpane">
<div class="tvstage">
  <div class="tv-screen">
    <video id="tv" autoplay playsinline></video>
    <div class="tv-idle" id="tvIdle">
      <div class="tv-idle-logo" id="tvIdleLogo"></div>
      <div class="tv-idle-title">海旁蜃气象楼台</div>
      <div class="tv-idle-sub" id="tvIdleSub">在右侧选择一个频道开始观看</div>
      <button class="btn primary" id="btnResume" hidden>继续观看上次的频道</button>
    </div>
    <div class="tv-badge" id="tvBadge" hidden></div>
    <div class="tv-errbar" id="tvErrbar" hidden>
      <button class="btn primary" id="btnErrVlc">用 VLC 打开</button>
    </div>
    <div class="tv-loading" id="tvLoading" hidden><span class="spin-lg"></span></div>
  </div>
  <div class="tv-bar">
    <span class="dot" id="tvDot"></span>
    <span class="tv-name" id="tvName" title="">未在观看</span>
    <span class="spacer"></span>
    <span class="volbox">
      <button class="btn sm" id="btnMute" title="静音 / 恢复">音量</button>
      <input type="range" id="volSlider" min="0" max="100" step="1" value="100" title="音量">
      <span class="muted" id="volLabel" style="min-width:26px;text-align:right">100</span>
    </span>
    <button class="btn" id="btnFav" disabled title="收藏当前频道">收藏</button>
    <button class="btn" id="btnRecord" disabled>录制</button>
    <button class="btn" id="btnVlc" disabled title="用 VLC 窗口打开（rtsp 等内嵌放不了的协议用这个）">VLC 打开</button>
    <button class="btn" id="btnPlayPause" disabled>播放</button>
    <button class="btn" id="btnFullscreen" title="全屏 / 退出全屏">全屏</button>
  </div>
</div>
    </div>
  </section>

  <!-- 页签二：搜索电视台 -->
  <section id="tab-search" class="tabpane">
    <div class="searchbar">
      <label class="sfield grow"><span>关键词</span><input id="qName" placeholder="如：CCTV / 湖南 / news"></label>
      <label class="sfield"><span>地区</span>
        <select id="qCountry">
          <option value="CN" selected>中国</option>
          <option value="HK">中国香港</option>
          <option value="TW">中国台湾</option>
          <option value="JP">日本</option>
          <option value="KR">韩国</option>
          <option value="US">美国</option>
          <option value="GB">英国</option>
          <option value="">全部地区</option>
        </select>
      </label>
      <label class="sfield"><span>分类</span><select id="qCat"><option value="">全部分类</option></select></label>
      <label class="sfield"><span>数量</span>
        <select id="qLimit">
          <option>30</option><option selected>60</option><option>120</option>
        </select>
      </label>
      <label class="sfield target"><span>添加到</span><select id="addTarget"></select></label>
      <button class="btn primary" id="btnSearch">搜索</button>
    </div>
    <div class="search-meta">
      <span id="searchStatus" class="muted"></span>
      <span class="spacer"></span>
      <button class="btn sm" id="btnRefreshIptv" title="重新下载 iptv-org 频道库（每日自动缓存）">刷新频道库</button>
    </div>
    <div class="table-wrap grow">
      <table class="grid">
        <thead><tr>
          <th style="width:42px;text-align:center"></th><th>频道</th><th style="width:90px">国家</th>
          <th style="width:150px">分类</th><th style="width:80px;text-align:center">收藏 / 添加</th>
        </tr></thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </section>
  <!-- 页签三：录制回看 -->
  <section id="tab-recordings" class="tabpane">
    <div class="pl-toolbar" style="margin-bottom:0">
      <h2>录制列表</h2>
      <span class="muted" id="recCount"></span>
      <span class="spacer"></span>
      <span class="muted" id="recDirLabel" style="font-size:12px"></span>
    </div>
    <div class="table-wrap grow">
      <table class="grid">
        <thead><tr>
          <th style="width:42px"></th><th>频道</th><th style="width:160px">开始时间</th>
          <th style="width:100px">大小</th><th style="width:90px">时长</th>
          <th style="width:90px">状态</th><th style="width:120px">操作</th>
        </tr></thead>
        <tbody id="recBody"></tbody>
      </table>
    </div>
  </section>
</main>
</div>

<div class="modal-mask" id="modalMask" hidden><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="core.js"></script>
<script src="icons.js"></script>
<script src="playlists.js"></script>
<script src="search.js"></script>
<script src="recordings.js"></script>
<script src="favorites.js"></script>
<script src="stage.js"></script>
<script src="shell.js"></script>
<script src="main.js"></script>
</body>
</html>
